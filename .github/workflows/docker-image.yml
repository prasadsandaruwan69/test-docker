name: Deploy Docker App

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: onimtacloude
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/app
            git pull origin master
            docker build -t test-docker .
            docker stop test-docker || true
            docker rm test-docker || true
            docker run -d -p 200:80 --name test-docker test-docker
