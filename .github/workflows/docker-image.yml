name: Deploy Docker App

on:
  push:
    branches: ["master"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          debug: true
          script: |
            echo "🚀 Deploy started"

            cd ~/app || exit 1

            git fetch --all
            git reset --hard origin/master

            # STOP + REMOVE OLD CONTAINER
            docker stop test-docker || true
            docker rm test-docker || true

            # REMOVE OLD IMAGE (IMPORTANT)
            docker rmi test-docker || true

            # FORCE CLEAN BUILD (VERY IMPORTANT FIX)
            docker build --no-cache -t test-docker .

            # RUN NEW CONTAINER
            docker run -d -p 200:80 --name test-docker test-docker

            echo "✅ Deploy completed"